name: klimatrack_app
description: "A clean and modern weather tracking app that fetches data via JSON and XML formats."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  animate_do: ^4.2.0
  bloc: ^8.1.4
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  freezed: ^2.4.7
  freezed_annotation: ^2.4.1
  geolocator: ^11.0.0
  get_it: ^7.6.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  xml: ^6.5.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  build_runner: ^2.4.8
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  bloc_test: ^9.1.6

flutter:
  uses-material-design: true

  assets:
    - assets/weather_icons/
    - assets/images/
    - .env
